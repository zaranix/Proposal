<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#374151"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 17px; fill: #4b5563; }
      .math { font-family: Arial, sans-serif; font-size: 20px; fill: #111827; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.2; rx: 14; }
      .blue { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.2; rx: 14; }
      .amber { fill: #fff7ed; stroke: #d97706; stroke-width: 2.2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 14; }
      .loss { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 1.8; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="550" y="45" text-anchor="middle" class="title">Structural transition model</text>

  <rect x="40" y="120" width="145" height="100" class="box"/>
  <text x="112" y="158" text-anchor="middle" class="label">Input</text>
  <text x="112" y="190" text-anchor="middle" class="math">[s_t, a_t]</text>

  <rect x="245" y="95" width="200" height="150" class="blue"/>
  <text x="345" y="135" text-anchor="middle" class="label">Scalar encoder</text>
  <text x="345" y="167" text-anchor="middle" class="small">shared across dimensions</text>
  <text x="345" y="197" text-anchor="middle" class="math">x_m + position emb.</text>
  <text x="345" y="224" text-anchor="middle" class="math">F_e in R^(M x d_f)</text>

  <rect x="505" y="95" width="180" height="150" class="amber"/>
  <text x="595" y="135" text-anchor="middle" class="label">Sparse graph</text>
  <text x="595" y="168" text-anchor="middle" class="math">G_phi</text>
  <text x="595" y="197" text-anchor="middle" class="small">input-output edges</text>
  <text x="595" y="224" text-anchor="middle" class="math">F_d = F_e^T G_phi</text>

  <rect x="745" y="95" width="205" height="150" class="blue"/>
  <text x="847" y="135" text-anchor="middle" class="label">Scalar decoder</text>
  <text x="847" y="167" text-anchor="middle" class="small">shared across outputs</text>
  <text x="847" y="197" text-anchor="middle" class="math">F_d + output emb.</text>
  <text x="847" y="224" text-anchor="middle" class="math">O = n + 1</text>

  <rect x="985" y="120" width="85" height="100" class="green"/>
  <text x="1027" y="157" text-anchor="middle" class="label">Output</text>
  <text x="1027" y="190" text-anchor="middle" class="math">s'_hat, r_hat</text>

  <path d="M185 170 H245" class="arrow"/>
  <path d="M445 170 H505" class="arrow"/>
  <path d="M685 170 H745" class="arrow"/>
  <path d="M950 170 H985" class="arrow"/>

  <rect x="118" y="315" width="865" height="110" class="loss"/>
  <text x="550" y="350" text-anchor="middle" class="label">Training objective</text>
  <text x="550" y="386" text-anchor="middle" class="math">
    prediction loss for next state and reward  +  lambda ||G_phi||_p
  </text>
  <text x="550" y="413" text-anchor="middle" class="small">
    The sparsity penalty encourages the model to ignore unnecessary dependencies.
  </text>

  <path d="M1027 220 C1027 285 900 295 900 315" class="soft"/>
  <path d="M595 245 C595 285 595 295 595 315" class="soft"/>

  <text x="550" y="485" text-anchor="middle" class="small">
    Here M is the number of input variables from state and action; O is the number of predicted variables: next-state dimensions plus reward.
  </text>
</svg>
